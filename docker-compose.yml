  #   ports:
  #     - "1025:1025"
  #   networks:
  #     - streampix-net
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #   command: >
  #     sh -c "
  #       echo 'Rodando SMTP em MODO PRODUÇÃO...' &&
  #       java -jar app.jar
  #     "


# -------------------------
# Rede interna
# -------------------------
networks:
  streampix-net:
    driver: bridge

# -------------------------
# Volumes para cache (usado apenas no modo dev)
# -------------------------
volumes:
  maven_cache:
    driver: local
